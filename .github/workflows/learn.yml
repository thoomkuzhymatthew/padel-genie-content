name: Update intern
run-name: Update intern ${{ inputs.learning_run_id || 'weekly' }}
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      learning_run_id:
        description: Learning run UUID (blank creates a scheduled/manual run)
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: intern-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run learn
        env:
          LEARNING_RUN_ID: ${{ inputs.learning_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          INBOX_URL: https://padel-genie-content.vercel.app

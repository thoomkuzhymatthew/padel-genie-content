name: Update intern
run-name: Update intern ${{ inputs.learning_run_id || 'weekly' }}
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      learning_run_id:
        description: Learning run UUID (blank creates a scheduled/manual run)
        required: false
        type: string
      notifications_only:
        description: Retry failed learning/replay notifications for an existing run
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: intern-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run learn
        if: ${{ !inputs.notifications_only }}
        env:
          LEARNING_RUN_ID: ${{ inputs.learning_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          INBOX_URL: https://padel-genie-content.vercel.app
      - name: Retry failed notifications
        if: ${{ inputs.notifications_only }}
        run: npm run notify:retry -- "$LEARNING_RUN_ID"
        env:
          LEARNING_RUN_ID: ${{ inputs.learning_run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          INBOX_URL: https://padel-genie-content.vercel.app
      - name: Record setup or job failure
        if: failure() && inputs.learning_run_id != ''
        env:
          LEARNING_RUN_ID: ${{ inputs.learning_run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module <<'JS'
          const {SUPABASE_URL,SUPABASE_SECRET_KEY,LEARNING_RUN_ID}=process.env;
          if(SUPABASE_URL&&SUPABASE_SECRET_KEY&&LEARNING_RUN_ID)await fetch(`${SUPABASE_URL}/rest/v1/learning_runs?id=eq.${LEARNING_RUN_ID}&status=in.(queued,running)`,{method:'PATCH',headers:{apikey:SUPABASE_SECRET_KEY,Authorization:'Bearer '+SUPABASE_SECRET_KEY,'Content-Type':'application/json'},body:JSON.stringify({status:'failed',stage:'Workflow failed',error:'The workflow failed before completion. Check its GitHub Actions log.'})});
          JS

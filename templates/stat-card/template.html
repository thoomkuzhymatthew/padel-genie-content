<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Padel Genie stat card</title><style>{{style}}</style></head>
<body><main class="graphic">
<header><div class="wordmark"><span class="brand-mark"></span>{{wordmark}}</div><span class="edition">The Court Report</span></header>
<section class="intro"><h1>{{headline}}</h1><span class="issue">UK padel</span></section>
<section class="stat"><div class="court-lines" aria-hidden="true"><span></span></div><p class="hero">{{hero}}</p><p class="context">{{context}}</p><div class="divider"></div><p class="comparison">{{comparison}}</p></section>
<footer><p class="hold-back">{{hold_back}} <span aria-hidden="true">↗</span></p><div class="source"><span>{{source_line}}</span><span>padelgenie.io</span></div></footer>
</main></body></html>
